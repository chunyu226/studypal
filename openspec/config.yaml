schema: spec-driven

context: |
  项目：个人品牌站 → 全栈 AI 学习平台（演进中）
  技术栈：
    - 前端：React 19 + Vite 7 + TypeScript + Tailwind CSS v4
    - 后端（即将添加）：FastAPI + SQLite
  样式方案：Tailwind CSS v4（@tailwindcss/vite 插件），dark mode 使用 class 策略（.dark 选择器），CSS 变量定义渐变背景色
  路由：当前无路由库，单页 anchor 滚动导航（#hero / #projects / #about / #contact），通过 Element.scrollIntoView 实现
  部署：GitHub Pages（gh-pages 分支），base path /my-website/，前端构建后部署；后端独立部署（不在 GitHub Pages 范围内）
  约束：
    - 复用已有组件（Navbar / Hero / ProjectShowcase / AboutSection / ThemeToggle / ParticleBackground），不推倒重来
    - 新增后端不影响前端现有构建流程，前后端目录隔离

rules:
  specs:
    - 所有 API 行为使用 Given/When/Then 格式
    - 每个 spec 必须包含至少一个错误场景
    - 每个 requirement 的 scenario 不超过 5 个
    - 单个 spec 文件不超过 2000 词
    - 省略理由说明，除非直接影响实现
    - 使用 RFC 2119 关键词（SHALL/SHOULD/MAY）
  tasks:
    - 单个 task 不超过 2 小时工作量
    - 相关 task 按 phase 分组
    - 每个 phase 结束后包含验证步骤
    - 新建服务前必须先检查是否有可复用的已有服务
  design:
    - 包含组件层级图
    - 文档化所有 API 端点规范
  proposal:
    - 必须显式列出不做的事项（out-of-scope/NOT doing 清单）
    - 高风险变更必须包含回滚方案

languages: |
  Generate all artifacts in Simplified Chinese.
  Use English for code-related terms.
